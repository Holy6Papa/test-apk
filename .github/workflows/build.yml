name: Fabriquer l'APK et le .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère les dossiers Android manquants sans toucher au code de lib/
      - run: flutter create --platforms=android --org com.holy6papa .

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: application-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Application Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère les dossiers Windows manquants sans toucher au code de lib/
      - run: flutter create --platforms=windows --org com.holy6papa .

      - run: flutter pub get

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: application-windows
          path: build/windows/x64/runner/Release/
